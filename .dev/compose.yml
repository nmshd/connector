services:
  connector-1:
    build:
      context: .
      dockerfile: ./Dockerfile.debug
    container_name: connector-1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:80" # Webserver
      - "9229:9229" # Debugger
    environment:
      - CUSTOM_CONFIG_LOCATION=/config.json
      - SYNC_ENABLED=${SYNC_ENABLED:-false}
      - DATABASE_NAME=${DATABASE_NAME_PREFIX:-connector}-1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=enmeshed.connector-1
      - transportLibrary__baseUrl
      - transportLibrary__addressGenerationHostnameOverride
      - transportLibrary__platformClientId
      - transportLibrary__platformClientSecret
      - modules__sse__enabled=${modules__sse__enabled:-false}
      - modules__sse__baseUrlOverride
    volumes:
      - ..:/usr/app
      - ./config.json:/config.json:ro
    depends_on:
      - mongo
      - mongo-express
      - otel-collector
      - grafana
    stdin_open: true
    tty: true

  connector-2:
    build:
      context: .
      dockerfile: ./Dockerfile.debug
    container_name: connector-2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:80" # Webserver
      - "9231:9229" # Debugger
    environment:
      - CUSTOM_CONFIG_LOCATION=/config.json
      - SYNC_ENABLED=${SYNC_ENABLED:-false}
      - DATABASE_NAME=${DATABASE_NAME_PREFIX:-connector}-2
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=enmeshed.connector-2
      - transportLibrary__baseUrl
      - transportLibrary__addressGenerationHostnameOverride
      - transportLibrary__platformClientId
      - transportLibrary__platformClientSecret
      - modules__sse__enabled=${modules__sse__enabled:-false}
      - modules__sse__baseUrlOverride
    volumes:
      - ..:/usr/app
      - ./config.json:/config.json:ro
    depends_on:
      - mongo
      - mongo-express
      - otel-collector
      - grafana
    stdin_open: true
    tty: true

  mongo:
    container_name: mongo
    hostname: mongo
    image: mongo@sha256:5d7043a4ffe02b9ed1b6e0bab057546981af5ca0a79107e9c461e49bc44c0a7b
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    logging:
      driver: none

  mongo-express:
    container_name: mongo-express
    image: mongo-express@sha256:1b23d7976f0210dbec74045c209e52fbb26d29b2e873d6c6fa3d3f0ae32c2a64
    ports:
      - "3003:8081"
    environment:
      ME_CONFIG_OPTIONS_EDITORTHEME: lucario
      ME_CONFIG_MONGODB_SERVER: mongo
    depends_on:
      - mongo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      - loki
      - prometheus
      - tempo

  prometheus:
    image: prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:3.7.4@sha256:87f0a067673756a3cede1bcbf0c74875f7df9b09fddb53e399d0c576f756cfcc
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  tempo:
    image: grafana/tempo:2.10.7@sha256:032b3acb51ed02c4b801473d54bb63e9e9f13738d215126d9843c30283794f4b
    command: ["-config.file=/etc/tempo.yml"]
    user: "0:0"
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
      - tempo

volumes:
  mongo_data:
  grafana_data:
  loki_data:
  prometheus_data:
  tempo_data:
