name: Dependency Security Maintenance

on:
  schedule:
    - cron: "0 2 * * 2" # every Tuesday at 02:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  npm-audit:
    uses: js-soft/github-actions/.github/workflows/dependency-security-maintenance.yml@7341f0fefe5319a41ead6e19d833f142a306159a # main
    with:
      reviewers: nmshd/npm-dependency-update-reviewers
    secrets:
      github-token: ${{ secrets.GH_PAT }}
