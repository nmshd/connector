name: Weekly Release of Dependency Updates

on:
  schedule:
    - cron: "0 2 * * 5" # every Friday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-dependency-release
  cancel-in-progress: false

jobs:
  release:
    uses: js-soft/github-actions/.github/workflows/release-dependency-updates.yml@7341f0fefe5319a41ead6e19d833f142a306159a # main
    secrets:
      github-token: ${{ secrets.GH_PAT }}
