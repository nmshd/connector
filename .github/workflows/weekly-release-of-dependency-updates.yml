name: Weekly Release of Dependency Updates

on:
  schedule:
    - cron: "0 2 * * 5" # every Friday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-dependency-release
  cancel-in-progress: false

jobs:
  release:
    uses: js-soft/github-actions/.github/workflows/release-dependency-updates.yml@f7d9176eafe2668d196f441f76447e182ce3fd45 # main
    secrets:
      github-token: ${{ secrets.GH_PAT }}
